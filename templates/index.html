<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Item Manager - CRUD Application</h1>

        <!-- Create Form -->
        <div class="card">
            <h2>Add New Item</h2>
            <form id="createForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Item</button>
            </form>
        </div>

        <!-- Items List -->
        <div class="card">
            <h2>Items List</h2>
            <div id="itemsList">
                <p class="loading">Loading items...</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Item</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editName">Name *</label>
                    <input type="text" id="editName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription" name="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update Item</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // Load items on page load
        document.addEventListener('DOMContentLoaded', loadItems);

        // Create item
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('createForm').reset();
                    loadItems();
                    showMessage('Item created successfully!', 'success');
                } else {
                    const error = await response.json();
                    showMessage(error.error || 'Failed to create item', 'error');
                }
            } catch (err) {
                showMessage('Network error', 'error');
            }
        });

        // Load all items
        async function loadItems() {
            try {
                const response = await fetch('/items');
                const items = await response.json();

                const itemsList = document.getElementById('itemsList');
                if (items.length === 0) {
                    itemsList.innerHTML = '<p class="no-items">No items found. Add your first item above!</p>';
                    return;
                }

                itemsList.innerHTML = items.map(item => `
                    <div class="item">
                        <div class="item-content">
                            <h3>${escapeHtml(item.name)}</h3>
                            <p>${escapeHtml(item.description || 'No description')}</p>
                            <small>ID: ${item.id}</small>
                        </div>
                        <div class="item-actions">
                            <button onclick="editItem(${item.id})" class="btn btn-small btn-edit">Edit</button>
                            <button onclick="deleteItem(${item.id})" class="btn btn-small btn-delete">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('itemsList').innerHTML = '<p class="error">Failed to load items</p>';
            }
        }

        // Edit item
        async function editItem(id) {
            try {
                const response = await fetch(`/items/${id}`);
                const item = await response.json();

                document.getElementById('editId').value = item.id;
                document.getElementById('editName').value = item.name;
                document.getElementById('editDescription').value = item.description || '';

                document.getElementById('editModal').style.display = 'block';
            } catch (err) {
                showMessage('Failed to load item', 'error');
            }
        }

        // Update item
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const formData = {
                name: document.getElementById('editName').value,
                description: document.getElementById('editDescription').value
            };

            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    closeModal();
                    loadItems();
                    showMessage('Item updated successfully!', 'success');
                } else {
                    showMessage('Failed to update item', 'error');
                }
            } catch (err) {
                showMessage('Network error', 'error');
            }
        });

        // Delete item
        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            try {
                const response = await fetch(`/items/${id}`, { method: 'DELETE' });

                if (response.ok) {
                    loadItems();
                    showMessage('Item deleted successfully!', 'success');
                } else {
                    showMessage('Failed to delete item', 'error');
                }
            } catch (err) {
                showMessage('Network error', 'error');
            }
        }

        // Modal functions
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        document.querySelector('.close').onclick = closeModal;
        window.onclick = (event) => {
            const modal = document.getElementById('editModal');
            if (event.target === modal) closeModal();
        };

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.classList.add('show');
            }, 10);

            setTimeout(() => {
                messageDiv.classList.remove('show');
                setTimeout(() => messageDiv.remove(), 300);
            }, 3000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
